[package]
name = "crafts-sync"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.89"
description = "Mirrors the storytold craft apps web builds for craft.zuujis.com"

[dependencies]
brotli = "9.1.1"
flate2 = "1.1.10"
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
